<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#f8fafc"/>
  <text x="450" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1e293b">Action 筛选：从几百个候选里选出最合适的那一个</text>

  <!-- Row 1: code-based deterministic filters -->
  <g transform="translate(50, 90)">
    <rect width="120" height="50" rx="8" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
    <text x="60" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#991b1b">全部 Action</text>
    <text x="60" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#7f1d1d">N = 100+</text>
  </g>
  <line x1="170" y1="115" x2="200" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(200, 90)">
    <rect width="120" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="60" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e40af">意图/标签</text>
    <text x="60" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1e3a8a">代码筛选</text>
  </g>
  <line x1="320" y1="115" x2="350" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(350, 90)">
    <rect width="120" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="60" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e40af">规则引擎</text>
    <text x="60" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1e3a8a">代码筛选</text>
  </g>
  <line x1="470" y1="115" x2="500" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(500, 90)">
    <rect width="120" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="60" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e40af">前置条件/权限</text>
    <text x="60" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1e3a8a">代码筛选</text>
  </g>
  <line x1="620" y1="115" x2="650" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(650, 90)">
    <rect width="120" height="50" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="60" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#14532d">历史成功率</text>
    <text x="60" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#166534">排序/降权</text>
  </g>

  <!-- Turn down to row 2 -->
  <path d="M 710 140 L 710 175" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 710 175 L 260 175" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M 260 175 L 260 190" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: ranking and LLM filters -->
  <g transform="translate(200, 190)">
    <rect width="120" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="60" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#78350f">信息增益</text>
    <text x="60" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#92400e">排序</text>
  </g>
  <line x1="320" y1="215" x2="350" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(350, 190)">
    <rect width="120" height="50" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
    <text x="60" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#581c87">LLM 粗筛</text>
    <text x="60" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b21a8">Fast LLM</text>
  </g>
  <line x1="470" y1="215" x2="500" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(500, 190)">
    <rect width="120" height="50" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
    <text x="60" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#581c87">LLM 精筛</text>
    <text x="60" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b21a8">Pro LLM</text>
  </g>
  <line x1="620" y1="215" x2="650" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(650, 190)">
    <rect width="120" height="50" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
    <text x="60" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#14532d">最终 Action</text>
    <text x="60" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#166534">N = 1</text>
  </g>

  <!-- Bottom note -->
  <text x="450" y="330" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">代码先做确定性筛选，大模型只在少量候选中做语义精筛；筛选后仍要执行前二次校验</text>
</svg>