<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="520" fill="#f8fafc"/>
  <text x="400" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1e293b">TAO：不是三段 Prompt，而是受控状态循环</text>

  <!-- Main cycle -->
  <ellipse cx="400" cy="260" rx="220" ry="180" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Think -->
  <g transform="translate(400, 120)">
    <rect x="-80" y="0" width="160" height="70" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="0" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1e40af">Think</text>
    <text x="0" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e3a8a">目标/状态/路径/停止/风险</text>
  </g>

  <!-- Action -->
  <g transform="translate(560, 260)">
    <rect x="-80" y="0" width="160" height="70" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="0" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#14532d">Action</text>
    <text x="0" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#166534">执行候选空间中的动作</text>
  </g>

  <!-- Observation -->
  <g transform="translate(400, 400)">
    <rect x="-80" y="0" width="160" height="70" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#78350f">Observation</text>
    <text x="0" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#92400e">提取事实 / 绑定证据 / 识别缺口</text>
  </g>

  <!-- State update -->
  <g transform="translate(240, 260)">
    <rect x="-80" y="0" width="160" height="70" rx="12" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
    <text x="0" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#581c87">状态更新</text>
    <text x="0" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b21a8">Goal/Action/Observation/Fact/Control</text>
  </g>

  <!-- Arrows -->
  <path d="M 450 165 Q 560 200 540 240" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 560 300 Q 520 380 460 400" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 350 400 Q 260 360 260 300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 260 220 Q 300 170 360 150" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Exit types -->
  <g transform="translate(180, 80)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">六种出口</text>
    <text x="0" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">continue · finish · clarify</text>
    <text x="0" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">retry · replan · interrupt</text>
  </g>

  <!-- Outer supervisor -->
  <rect x="520" y="80" width="220" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="630" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">外层监督（可选）</text>
  <text x="630" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">检测 Goal 漂移、约束违反、</text>
  <text x="630" y="142" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">长期停滞</text>
  <line x1="560" y1="115" x2="480" y2="140" stroke="#334155" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Bottom note -->
  <text x="400" y="500" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">HTTP 200 ≠ 真实成功：Observation 把原始输出转成结构化状态更新，是反幻觉的关键</text>
</svg>