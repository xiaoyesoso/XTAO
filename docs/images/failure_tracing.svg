<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="460" fill="#f8fafc"/>
  <text x="450" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1e293b">失败回溯：失败点 ≠ 根因点 ≠ 回滚点 ≠ Replan 起点</text>

  <!-- Timeline steps -->
  <line x1="80" y1="160" x2="820" y2="160" stroke="#94a3b8" stroke-width="3"/>

  <!-- Step 1 -->
  <circle cx="140" cy="160" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="140" y="166" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e40af">S1</text>
  <text x="140" y="205" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">加载画像</text>

  <!-- Step 2 root cause -->
  <circle cx="300" cy="160" r="22" fill="#fecaca" stroke="#ef4444" stroke-width="3"/>
  <text x="300" y="166" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#991b1b">S2</text>
  <text x="300" y="205" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">提取价格偏好</text>
  <text x="300" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#dc2626">根因点</text>
  <text x="300" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7f1d1d">错误复用电子产品偏好</text>

  <!-- Step 3 -->
  <circle cx="460" cy="160" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="460" y="166" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e40af">S3</text>
  <text x="460" y="205" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">检索候选</text>

  <!-- Step 4 -->
  <circle cx="620" cy="160" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="620" y="166" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e40af">S4</text>
  <text x="620" y="205" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">排序输出</text>

  <!-- Step 5 failure -->
  <circle cx="780" cy="160" r="22" fill="#fee2e2" stroke="#f43f5e" stroke-width="3"/>
  <text x="780" y="166" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" size="12" font-weight="700" fill="#9f1239">S5</text>
  <text x="780" y="205" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">最终推荐</text>
  <text x="780" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#dc2626">失败点</text>
  <text x="780" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7f1d1d">用户反馈太贵</text>

  <!-- Backward trace arrow -->
  <path d="M 760 145 Q 540 80 320 145" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="540" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#dc2626">反向追溯：从失败点找到根因点</text>

  <!-- Rollback point -->
  <g transform="translate(230, 260)">
    <rect width="180" height="70" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="90" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#78350f">回滚点</text>
    <text x="90" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#92400e">最近可信 Checkpoint</text>
  </g>
  <line x1="320" y1="260" x2="320" y2="185" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Replan start -->
  <g transform="translate(490, 260)">
    <rect width="180" height="70" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
    <text x="90" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#581c87">Replan 起点</text>
    <text x="90" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6b21a8">从受影响决策节点重规划</text>
  </g>
  <line x1="580" y1="260" x2="620" y2="185" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Bottom note -->
  <text x="450" y="390" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">代码负责 DAG 遍历、Dirty 传播、找最近 Checkpoint；大模型负责语义根因定位</text>
</svg>